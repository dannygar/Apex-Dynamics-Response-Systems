[project]
name = "agent-eval"
version = "0.1.0"
description = "Evaluator for HVE Core Design Thinking, BRD, and PRD agent outputs"
authors = [
    { name = "dannygar", email = "dannyg@microsoft.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.26.0",
    "openai>=3.25.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
    "tqdm>=4.70.1",
]
